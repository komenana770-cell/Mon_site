<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Création de sites web professionnels</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #2c3e50, #3498db);
            color: white;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }

        .box {
            background: white;
            color: #333;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .services {
            text-align: left;
            margin-top: 20px;
        }

        .services li {
            margin: 10px 0;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 25px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .btn:hover {
            background: #1ebe5d;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Création de sites web modernes</h1>
    <p>Boostez votre visibilité et attirez plus de clients</p>

    <div class="box">
        <h2>Mes services</h2>

        <ul class="services">
            <li>✔ Site pour restaurant</li>
            <li>✔ Site pour boutique</li>
            <li>✔ Site pour entreprise</li>
            <li>✔ Design moderne et rapide</li>
        </ul>

        <h3>Contactez-moi</h3>
        <p>Disponible sur WhatsApp</p>

        <a class="btn" href="https://Wa.me/+22503545832">
            Me contacter
        </a>
    </div>

    <footer>
        © 2026 - Création de sites web
    </footer>
</div>

</body>
</html>
